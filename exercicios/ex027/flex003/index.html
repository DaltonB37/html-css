<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background: lightsalmon;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap-reverse;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de bloco</div>
        <div class="item">Exemplo de bloco</div>
        <div class="item">Exemplo de bloco</div>
        <div class="item">Exemplo de bloco</div>
        <div class="item">Exemplo de bloco</div>
        <div class="item">Exemplo de bloco</div>
        <div class="item">Exemplo de bloco</div>
    </div>
</body>
</html>
