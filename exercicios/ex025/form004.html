<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for=""></label>
        </p>
        <p>
            <label for="iemail">E-mail</label>
            <input type="email" name="mail" id="iemail" autocomplete="email" required>
        </p>
        <p>
            <label for="itel">Telefone</label>
            <input type="tel" id="itel" placeholder="(99)99999-9999" maxlength="14"required>
        <script>document.getElementById('itel').addEventListener('input', function (e) {
                    let v = e.target.value.replace(/\D/g, '');

                    if (v.length > 11) v = v.slice(0, 11);

                    if (v.length >= 2) {
                     v = '(' + v.slice(0, 2) + ')' + v.slice(2);}
                    if (v.length >= 10) {
                    v = v.slice(0, 9) + '-' + v.slice(9);}
                    e.target.value = v;});
        </script>
        </p>
        <!--Estudar mais sobre RegEX-->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
